services:
  postgres:
    container_name: kkk_postgres
    image: postgres:18
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgrespass
      - POSTGRES_DB=postgres
    ports:
      - '5432:5432'
    volumes:
      - ./pgdata:/var/lib/postgresql
  nginx:
    image: nginx:1.30
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./../src:/var/www/html/
      - ./site.conf:/etc/nginx/conf.d/site.conf
      - ./logs:/var/log/nginx/
      - ./ssl:/var/ssl/
    depends_on:
      - php
      - ssl
  php:
    container_name: kkk_php
    build: ./php
    ports:
      - '9000:9000'
      - '9003:9003'
    volumes:
      - ./../src:/var/www/html/
    depends_on:
      - postgres
  ssl:
    build: ./ssl
    volumes:
      - ./ssl:/ssl/